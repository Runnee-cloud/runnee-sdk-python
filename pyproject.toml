[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runnee"
version = "0.1.0"
description = "Official synchronous and asynchronous Python SDK for Runnee Cloud"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Runnee"}]
keywords = ["runnee", "serverless", "sdk"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed", "Operating System :: OS Independent"]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://runnee.cloud/docs#sdk"
Repository = "https://github.com/Runnee-cloud/runnee-sdk-python"
Issues = "https://github.com/Runnee-cloud/runnee-sdk-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "mypy>=1.15", "ruff>=0.11", "build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/runnee"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md", "pyproject.toml", "openapi.json", "RELEASING.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/runnee"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
