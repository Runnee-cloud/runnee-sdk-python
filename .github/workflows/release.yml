name: Release
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact package version to build
        required: true
        default: "0.1.0"
        type: string
      publish:
        description: Publish publicly after environment approval
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python -c "import os,tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == os.environ['EXPECTED_VERSION']"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest && python -m mypy && python -m ruff check . && python -m ruff format --check .
      - run: python -m build && python -m twine check dist/*
      - name: Install built wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/runnee-consumer"
          "$RUNNER_TEMP/runnee-consumer/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runnee-consumer/bin/python" -c "from runnee import Runnee, AsyncRunnee; import importlib.metadata; print(importlib.metadata.version('runnee'))"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
